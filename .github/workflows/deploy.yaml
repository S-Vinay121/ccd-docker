
name: Build and Deploy to Minikube

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        shell: bash
        run: |
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$registry"

      - name: Build and test Docker image
        shell: bash
        run: |
          docker build -t cloud-app .

          test_name="cloud-app-test-${GITHUB_RUN_ID}"

          cleanup() {
            docker rm -f "$test_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$test_name" -p 18081:80 cloud-app

          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 2 \
            http://localhost:18081/ -o /dev/null

          echo "Website test passed!"

      - name: Push image to Amazon ECR
        shell: bash
        run: |
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image="${registry}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          docker tag cloud-app "$image"
          docker push "$image"

          echo "Pushed image: $image"

      - name: Refresh Kubernetes ECR credentials
        shell: bash
        run: |
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          token="$(aws ecr get-login-password --region "$AWS_REGION")"

          kubectl create secret docker-registry ecr-registry \
            --docker-server="$registry" \
            --docker-username=AWS \
            --docker-password="$token" \
            --dry-run=client -o yaml |
            kubectl apply -f -

      - name: Configure ECR image pull secret
        shell: bash
        run: |
          kubectl patch deployment cloud-app-deployment \
            --type=strategic \
            -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ecr-registry"}]}}}}'

      - name: Deploy to Minikube
        shell: bash
        run: |
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image="${registry}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          kubectl set image deployment/cloud-app-deployment \
            cloud-app="$image"

          kubectl rollout status deployment/cloud-app-deployment \
            --timeout=180s

          echo "Deployment completed successfully!"
