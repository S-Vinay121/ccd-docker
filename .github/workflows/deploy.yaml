
name: Build and Deploy to Minikube

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Diagnose AWS identity
        shell: powershell
        run: |
          aws sts get-caller-identity
          if ($LASTEXITCODE -ne 0) {
            throw "AWS identity check failed"
          }

          $token = aws ecr get-login-password --region $env:AWS_REGION
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($token)) {
            throw "Failed to obtain ECR token"
          }

          Write-Host "ECR token received successfully. Character count: $($token.Length)"

      - name: Login to Amazon ECR
        shell: powershell
        run: |
          $registry = "$env:AWS_ACCOUNT_ID.dkr.ecr.$env:AWS_REGION.amazonaws.com"
          $passwordFile = Join-Path $env:RUNNER_TEMP "ecr-password.txt"

          try {
            $token = aws ecr get-login-password --region $env:AWS_REGION

            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($token)) {
              throw "Failed to obtain ECR login token"
            }

            [System.IO.File]::WriteAllText(
              $passwordFile,
              $token,
              [System.Text.Encoding]::ASCII
            )

            $command = "docker login --username AWS --password-stdin $registry < `"$passwordFile`""
            cmd.exe /d /c $command

            if ($LASTEXITCODE -ne 0) {
              throw "ECR login failed"
            }

            Write-Host "Successfully logged in to Amazon ECR"
          }
          finally {
            Remove-Item $passwordFile -Force -ErrorAction SilentlyContinue
          }

      - name: Build and test image
        shell: powershell
        run: |
          docker build -t cloud-app .
          if ($LASTEXITCODE -ne 0) {
            throw "Docker build failed"
          }

          $testName = "cloud-app-test-$env:GITHUB_RUN_ID"

          try {
            docker run -d --name $testName -p 18081:80 cloud-app
            if ($LASTEXITCODE -ne 0) {
              throw "Test container failed to start"
            }

            $healthy = $false

            for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2

              try {
                $response = Invoke-WebRequest `
                  -Uri http://127.0.0.1:18081/ `
                  -TimeoutSec 5 `
                  -UseBasicParsing

                if ($response.StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              }
              catch {
                Write-Host "Waiting for Nginx: attempt $($i + 1)/15"
              }
            }

            if (-not $healthy) {
              docker ps -a --filter "name=$testName"
              docker logs $testName
              throw "Website health check failed"
            }

            Write-Host "Website test passed!"
          }
          finally {
            docker rm -f $testName 2>$null | Out-Null
          }

      - name: Push image to ECR
        shell: powershell
        run: |
          $registry = "$env:AWS_ACCOUNT_ID.dkr.ecr.$env:AWS_REGION.amazonaws.com"
          $image = "${registry}/${env:ECR_REPOSITORY}:${env:GITHUB_SHA}"

          docker tag cloud-app $image
          if ($LASTEXITCODE -ne 0) {
            throw "Docker tag failed"
          }

          docker push $image
          if ($LASTEXITCODE -ne 0) {
            throw "ECR push failed"
          }

          Write-Host "Pushed image: $image"

      - name: Refresh Kubernetes ECR credentials
        shell: powershell
        run: |
          $registry = "$env:AWS_ACCOUNT_ID.dkr.ecr.$env:AWS_REGION.amazonaws.com"
          $token = aws ecr get-login-password --region $env:AWS_REGION

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($token)) {
            throw "Failed to get ECR token"
          }

          kubectl create secret docker-registry ecr-registry `
            --docker-server=$registry `
            --docker-username=AWS `
            --docker-password=$token `
            --dry-run=client -o yaml |
            kubectl apply -f -

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create or update ECR pull secret"
          }

      - name: Configure ECR image pull secret
        shell: powershell
        run: |
          # Write patch JSON to a temp file to avoid Windows/PowerShell quoting issues
          $patchFile = Join-Path $env:RUNNER_TEMP "patch.json"
          $patchJson = @'
{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ecr-registry"}]}}}}
'@
          [System.IO.File]::WriteAllText($patchFile, $patchJson.Trim(), [System.Text.Encoding]::ASCII)

          kubectl patch deployment cloud-app-deployment --type=merge --patch-file=$patchFile

          if ($LASTEXITCODE -ne 0) {
            Remove-Item $patchFile -Force -ErrorAction SilentlyContinue
            throw "Failed to configure ECR image pull secret"
          }

          Remove-Item $patchFile -Force -ErrorAction SilentlyContinue
          Write-Host "ECR image pull secret configured successfully"

      - name: Deploy to Minikube
        shell: powershell
        run: |
          $registry = "$env:AWS_ACCOUNT_ID.dkr.ecr.$env:AWS_REGION.amazonaws.com"
          $image = "${registry}/${env:ECR_REPOSITORY}:${env:GITHUB_SHA}"

          kubectl set image deployment/cloud-app-deployment "cloud-app=$image"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update Deployment image"
          }

          kubectl rollout status deployment/cloud-app-deployment --timeout=180s
          if ($LASTEXITCODE -ne 0) {
            throw "Deployment rollout failed"
          }

          Write-Host "Deployment completed successfully"
