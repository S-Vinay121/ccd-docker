<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Web App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <h1>My Web App</h1>
  <h2>Cloud Computing and DevOps</h2>
  <h3>Vinay Srinivasa</h3>

  <button onclick="showMessage()">Click Me</button>

  <div id="message"></div>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "Hello! CI/CD is working! 🚀";
    }
  </script>

</body>

</html>
